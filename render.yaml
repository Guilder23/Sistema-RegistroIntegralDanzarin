services:
  - type: web
    name: sistemaamigos
    env: python
    buildCommand: bash build.sh
    startCommand: gunicorn sistemaamigos.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: sistemaamigos-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
databases:
  - name: sistemaamigos-db
    plan: free
    databaseName: sistemaamigos
    user: sistemaamigos
