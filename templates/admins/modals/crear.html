<div class="modal fade modal-crear-gestion" id="modalCrearAdmin" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-socio-dialog" role="document">
        <div class="modal-content">
            <form method="post" action="{% url 'socios:crear_admin' %}">
                {% csrf_token %}
                <div class="modal-header">
                    <h5 class="modal-title">Crear Administrador</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Cerrar">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-row">
                        <div class="col-md-6 form-group">
                            <label>Usuario</label>
                            <input type="text" name="username" class="form-control" required>
                        </div>
                        <div class="col-md-6 form-group">
                            <label>Correo</label>
                            <input type="email" name="email" class="form-control" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="col-md-6 form-group">
                            <label>Contraseña</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <div class="col-md-6 form-group">
                            <label>Nombre</label>
                            <input type="text" name="first_name" class="form-control">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Apellido</label>
                        <input type="text" name="last_name" class="form-control">
                    </div>
                    <div class="form-row">
                        <div class="col-md-4 form-group">
                            <label>Tipo de administrador</label>
                            <select name="rol" id="crearAdminRol" class="form-control" required>
                                <option value="superadministrador">Superadministrador</option>
                                <option value="administrador_grupo">Administrador de Grupo</option>
                                <option value="administrador_subgrupo">Administrador de Subgrupo</option>
                            </select>
                        </div>
                        <div class="col-md-4 form-group">
                            <label>Grupo</label>
                            <select name="grupo_id" id="crearAdminGrupo" class="form-control">
                                <option value="">Selecciona un grupo</option>
                                {% for grupo in grupos %}<option value="{{ grupo.id }}">{{ grupo.nombre }}</option>{% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4 form-group">
                            <label>Subgrupo</label>
                            <select name="subgrupo_id" id="crearAdminSubgrupo" class="form-control">
                                <option value="">Solo para Administrador de Subgrupo</option>
                                {% for subgrupo in subgrupos %}<option value="{{ subgrupo.id }}" data-grupo-id="{{ subgrupo.grupo_id }}">{{ subgrupo.grupo.nombre }} / {{ subgrupo.nombre }}</option>{% endfor %}
                            </select>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Crear</button>
                </div>
            </form>
        </div>
    </div>
</div>
