<div class="modal fade modal-editar-gestion" id="modalEditarAdmin" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-danzarin-dialog" role="document">
        <div class="modal-content">
            <form id="formEditarAdmin" method="post" action="">
                {% csrf_token %}
                <div class="modal-header">
                    <h5 class="modal-title">Editar Administrador</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Cerrar">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-row">
                        <div class="col-md-6 form-group">
                            <label>Usuario</label>
                            <input id="editarAdminUsername" type="text" name="username" class="form-control" required>
                        </div>
                        <div class="col-md-6 form-group">
                            <label>Correo</label>
                            <input id="editarAdminEmail" type="email" name="email" class="form-control" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="col-md-6 form-group">
                            <label>Nombre</label>
                            <input id="editarAdminFirstName" type="text" name="first_name" class="form-control">
                        </div>
                        <div class="col-md-6 form-group">
                            <label>Apellido</label>
                            <input id="editarAdminLastName" type="text" name="last_name" class="form-control">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Nueva contraseña (opcional)</label>
                        <input id="editarAdminPassword" type="password" name="password" class="form-control">
                    </div>
                    <div class="form-row">
                        <div class="col-md-4 form-group"><label>Tipo</label><select id="editarAdminRol" name="rol" class="form-control" required><option value="superadministrador">Superadministrador</option><option value="administrador_asociacion">Administrador de Asociación</option><option value="administrador_conjunto">Administrador de Conjunto</option></select></div>
                        <div class="col-md-4 form-group"><label>Asociación</label><select id="editarAdminAsociacion" name="asociacion_id" class="form-control" required><option value="">Selecciona una asociación</option>{% for asociacion in asociaciones %}<option value="{{ asociacion.id }}">{{ asociacion.nombre }}</option>{% endfor %}</select></div>
                        <div class="col-md-4 form-group"><label>Conjunto</label><select id="editarAdminConjunto" name="conjunto_id" class="form-control"><option value="">Solo para conjunto</option>{% for conjunto in conjuntos %}<option value="{{ conjunto.id }}" data-asociacion-id="{{ conjunto.asociacion_id }}">{{ conjunto.asociacion.nombre }} / {{ conjunto.nombre }}</option>{% endfor %}</select></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
