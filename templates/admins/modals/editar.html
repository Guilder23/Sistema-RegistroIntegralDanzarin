<div class="modal fade modal-editar-gestion" id="modalEditarAdmin" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-socio-dialog" role="document">
        <div class="modal-content">
            <form id="formEditarAdmin" method="post" action="">
                {% csrf_token %}
                <div class="modal-header">
                    <h5 class="modal-title">Editar Administrador</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Cerrar">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-row">
                        <div class="col-md-6 form-group">
                            <label>Usuario</label>
                            <input id="editarAdminUsername" type="text" name="username" class="form-control" required>
                        </div>
                        <div class="col-md-6 form-group">
                            <label>Correo</label>
                            <input id="editarAdminEmail" type="email" name="email" class="form-control" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="col-md-6 form-group">
                            <label>Nombre</label>
                            <input id="editarAdminFirstName" type="text" name="first_name" class="form-control">
                        </div>
                        <div class="col-md-6 form-group">
                            <label>Apellido</label>
                            <input id="editarAdminLastName" type="text" name="last_name" class="form-control">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Nueva contraseña (opcional)</label>
                        <input id="editarAdminPassword" type="password" name="password" class="form-control">
                    </div>
                    <div class="form-row">
                        <div class="col-md-4 form-group"><label>Tipo</label><select id="editarAdminRol" name="rol" class="form-control" required><option value="superadministrador">Superadministrador</option><option value="administrador_grupo">Administrador de Grupo</option><option value="administrador_subgrupo">Administrador de Subgrupo</option></select></div>
                        <div class="col-md-4 form-group"><label>Grupo</label><select id="editarAdminGrupo" name="grupo_id" class="form-control" required><option value="">Selecciona un grupo</option>{% for grupo in grupos %}<option value="{{ grupo.id }}">{{ grupo.nombre }}</option>{% endfor %}</select></div>
                        <div class="col-md-4 form-group"><label>Subgrupo</label><select id="editarAdminSubgrupo" name="subgrupo_id" class="form-control"><option value="">Solo para subgrupo</option>{% for subgrupo in subgrupos %}<option value="{{ subgrupo.id }}" data-grupo-id="{{ subgrupo.grupo_id }}">{{ subgrupo.grupo.nombre }} / {{ subgrupo.nombre }}</option>{% endfor %}</select></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
