<div class="modal fade modal-crear-gestion" id="modalCrearAsociacion" tabindex="-1" role="dialog" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <form method="post" action="{% url 'asociaciones:crear_asociacion' %}">
        {% csrf_token %}
        <div class="modal-header">
          <h5 class="modal-title">Nueva asociacion</h5>
          <button
            type="button"
            class="close"
            data-dismiss="modal"
            aria-label="Cerrar"
          >
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <label for="crearAsociacionNombre">Nombre</label>
          <input class="form-control" name="nombre" id="crearAsociacionNombre" required>
          <label class="mt-3">
            <input type="checkbox" name="activo" checked> Activo
          </label>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-dismiss="modal">
            Cancelar
          </button>
          <button type="submit" class="btn btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>
</div>
