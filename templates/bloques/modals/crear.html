<div class="modal fade" id="modalCrearBloque">
    <div class="modal-dialog">
        <div class="modal-content">
            <form method="post" action="{% url 'bloques:crear_bloque' %}">
                {% csrf_token %}
                <div class="modal-header">
                    <h5>Nuevo bloque</h5>
                </div>
                <div class="modal-body">
                    <label>Asociación</label>
                    <select class="form-control" name="asociacion_id" id="crearBloqueAsociacion">
                        {% for asociacion in asociaciones %}
                            <option value="{{ asociacion.id }}">{{ asociacion.nombre }}</option>
                        {% endfor %}
                    </select>

                    <label class="mt-3">Conjunto</label>
                    <select class="form-control" name="conjunto_id" id="crearBloqueConjunto">
                        {% for conjunto in conjuntos %}
                            <option value="{{ conjunto.id }}" data-asociacion="{{ conjunto.asociacion_id }}">{{ conjunto.nombre }}</option>
                        {% endfor %}
                    </select>

                    <label class="mt-3">Nombre</label>
                    <input class="form-control" name="nombre" required>

                    <label class="mt-3">Descripción</label>
                    <textarea class="form-control" name="descripcion" rows="3"></textarea>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
