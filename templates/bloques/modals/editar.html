<div class="modal fade" id="modalEditarBloque">
    <div class="modal-dialog">
        <div class="modal-content">
            <form method="post" id="formEditarBloque">
                {% csrf_token %}
                <div class="modal-header">
                    <h5>Editar bloque</h5>
                </div>
                <div class="modal-body">
                    <label>Conjunto</label>
                    <select class="form-control" name="conjunto_id" id="editarBloqueConjunto">
                        {% for conjunto in conjuntos %}
                            <option value="{{ conjunto.id }}" data-asociacion="{{ conjunto.asociacion_id }}">{{ conjunto.nombre }}</option>
                        {% endfor %}
                    </select>

                    <label class="mt-3">Nombre</label>
                    <input class="form-control" id="editarBloqueNombre" name="nombre" required>

                    <label class="mt-3">Descripción</label>
                    <textarea class="form-control" id="editarBloqueDescripcion" name="descripcion" rows="3"></textarea>

                    <div class="custom-control custom-switch mt-3">
                        <input type="checkbox" class="custom-control-input" id="editarBloqueActivo" name="activo">
                        <label class="custom-control-label" for="editarBloqueActivo">Activo</label>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-primary">Guardar cambios</button>
                </div>
            </form>
        </div>
    </div>
</div>
