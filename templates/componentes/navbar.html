{% load static %}
<nav class="navbar navbar-principal">
    <div class="navbar-container">
        <div class="navbar-left">
            <button class="sidebar-toggle-btn" id="sidebarToggle" title="Alternar menú" aria-label="Alternar menú">
                <i class="fas fa-bars"></i>
            </button>
            <div class="navbar-logo">
                <a href="{% url 'core:inicio' %}">
                    <img src="{% static 'img/LogoCarnavalOruroClub.png' %}" alt="Club Carnaval Oruro" class="navbar-logo-img">
                    <span class="navbar-brand-text">
                        <span class="brand-primary">Registro Unico del </span>
                        <span class="brand-secondary">DANZARIN</span>
                    </span>
                </a>
            </div>
        </div>

        <div class="navbar-right">
            <div class="navbar-usuario">
                <button class="navbar-user-btn" id="usuarioBtn" title="Mi cuenta" aria-haspopup="true" aria-expanded="false">
                    <div class="user-avatar">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="user-info">
                        <span class="user-name">{{ user.username|title }}</span>
                        <span class="user-role">{{ user.userprofile.get_rol_display|default:'Miembro' }}</span>
                    </div>
                    <i class="fas fa-chevron-down chevron-icon"></i>
                </button>
                <div class="navbar-dropdown usuario-dropdown" id="usuarioDropdown">
                    <div class="dropdown-user-header">
                        <div class="user-avatar-large">
                            <i class="fas fa-user-shield"></i>
                        </div>
                        <div class="user-header-text">
                            <span class="user-header-name">{{ user.get_full_name|default:user.username }}</span>
                            <span class="user-header-role">
                                <i class="fas fa-circle-check"></i> {{ user.userprofile.get_rol_display|default:'Miembro' }}
                            </span>
                        </div>
                    </div>
                    <div class="dropdown-items">
                        <a href="{% url 'socios:perfil_socio' %}" class="dropdown-item">
                            <i class="fas fa-user-circle"></i>
                            <span>Mi Perfil</span>
                        </a>
                        {% if user.userprofile.rol != 'miembro' %}
                        <a href="{% url 'core:registro' %}" class="dropdown-item">
                            <i class="fas fa-user-plus"></i>
                            <span>Registrar Usuarios</span>
                        </a>
                        {% endif %}
                    </div>
                    <div class="dropdown-divider"></div>
                    <a href="{% url 'core:logout' %}" class="dropdown-item dropdown-item-logout">
                        <i class="fas fa-arrow-right-from-bracket"></i>
                        <span>Cerrar Sesión</span>
                    </a>
                </div>
            </div>
        </div>
    </div>
</nav>
