<div
  class="modal fade modal-crear-gestion"
  id="modalCrearConjunto"
  tabindex="-1"
  role="dialog"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <form method="post" action="{% url 'conjuntos:crear_conjunto' %}">
        {% csrf_token %}
        <div class="modal-header">
          <h5 class="modal-title">Nuevo conjunto</h5>
          <button
            type="button"
            class="close"
            data-dismiss="modal"
            aria-label="Cerrar"
          >
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <label for="crearConjuntoAsociacion">Asociacion</label>
          <select class="form-control" name="asociacion_id" id="crearConjuntoAsociacion">
            {% for asociacion in asociaciones %}
            <option value="{{ asociacion.id }}">{{ asociacion.nombre }}</option>
            {% endfor %}
          </select>
          <label class="mt-3" for="crearConjuntoNombre">Nombre</label>
          <input class="form-control" name="nombre" id="crearConjuntoNombre" required>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-dismiss="modal">
            Cancelar
          </button>
          <button type="submit" class="btn btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>
</div>
