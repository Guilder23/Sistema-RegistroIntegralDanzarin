<div class="modal fade" id="modalCrearConjunto"><div class="modal-dialog"><div class="modal-content"><form method="post" action="{% url 'conjuntos:crear_conjunto' %}">{% csrf_token %}<div class="modal-header"><h5>Nuevo conjunto</h5></div><div class="modal-body"><label>Asociacion</label><select class="form-control" name="asociacion_id">{% for asociacion in asociaciones %}<option value="{{ asociacion.id }}">{{ asociacion.nombre }}</option>{% endfor %}</select><label class="mt-3">Nombre</label><input class="form-control" name="nombre" required></div><div class="modal-footer"><button class="btn btn-primary">Guardar</button></div></form></div></div></div>
