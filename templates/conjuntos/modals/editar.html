<div
  class="modal fade modal-editar-gestion"
  id="modalEditarConjunto"
  tabindex="-1"
  role="dialog"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <form method="post" id="formEditarConjunto">
        {% csrf_token %}
        <div class="modal-header">
          <h5 class="modal-title">Editar conjunto</h5>
          <button
            type="button"
            class="close"
            data-dismiss="modal"
            aria-label="Cerrar"
          >
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <label for="editarConjuntoNombre">Nombre</label>
          <input
            class="form-control"
            name="nombre"
            id="editarConjuntoNombre"
            required>
          <label class="mt-3">
            <input type="checkbox" name="activo" id="editarConjuntoActivo">
            Activo
          </label>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-dismiss="modal">
            Cancelar
          </button>
          <button type="submit" class="btn btn-primary">
            Guardar cambios
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
