<div class="modal fade modal-crear-danzarin" id="modalCrearDanzarin" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-danzarin-dialog" role="document">
        <div class="modal-content">
            <form method="post" action="{% url 'danzarines:crear_danzarin' %}" id="formCrearDanzarin" novalidate>
                {% csrf_token %}
                <div class="modal-header">
                    <h5 class="modal-title">Crear Danzarín</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Cerrar">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-row">
                        <div class="col-md-6 form-group">
                            <label>Usuario <span class="required-mark">*</span></label>
                            <input type="text" name="username" class="form-control" placeholder="Se genera automáticamente" readonly required>
                        </div>
                        <div class="col-md-6 form-group">
                            <label>Contraseña <span class="required-mark">*</span></label>
                            <input type="password" name="password" class="form-control" placeholder="Se genera automáticamente" readonly required>
                        </div>
                    </div>
                    <div class="form-row">
                        {% if role == 'administrador_conjunto' %}
                        <div class="col-md-4 form-group"><label>Asociación</label><select id="crearDanzarinAsociacion" class="form-control" disabled><option value="{{ request.user.userprofile.asociacion_id }}" selected>{{ request.user.userprofile.asociacion.nombre }}</option></select><input type="hidden" name="asociacion_id" value="{{ request.user.userprofile.asociacion_id }}"></div>
                        <div class="col-md-4 form-group"><label>Conjunto</label><select name="conjunto_id" id="crearDanzarinConjunto" class="form-control" disabled><option value="{{ request.user.userprofile.conjunto_id }}" data-asociacion-id="{{ request.user.userprofile.asociacion_id }}" selected>{{ request.user.userprofile.conjunto.nombre }}</option></select><input type="hidden" name="conjunto_id" value="{{ request.user.userprofile.conjunto_id }}"></div>
                        {% elif role == 'administrador_asociacion' %}
                        <div class="col-md-4 form-group"><label>Asociación</label><select id="crearDanzarinAsociacion" class="form-control" disabled><option value="{{ request.user.userprofile.asociacion_id }}">{{ request.user.userprofile.asociacion.nombre }}</option></select><input type="hidden" name="asociacion_id" value="{{ request.user.userprofile.asociacion_id }}"></div>
                        <div class="col-md-4 form-group"><label>Conjunto</label><select name="conjunto_id" id="crearDanzarinConjunto" class="form-control" required><option value="">Selecciona</option>{% for conjunto in conjuntos %}<option value="{{ conjunto.id }}" data-asociacion-id="{{ conjunto.asociacion_id }}">{{ conjunto.nombre }}</option>{% endfor %}</select></div>
                        {% else %}
                        <div class="col-md-4 form-group"><label>Asociación</label><select name="asociacion_id" id="crearDanzarinAsociacion" class="form-control" required><option value="">Selecciona</option>{% for asociacion in asociaciones %}<option value="{{ asociacion.id }}">{{ asociacion.nombre }}</option>{% endfor %}</select></div>
                        <div class="col-md-4 form-group"><label>Conjunto</label><select name="conjunto_id" id="crearDanzarinConjunto" class="form-control" required><option value="">Selecciona</option>{% for conjunto in conjuntos %}<option value="{{ conjunto.id }}" data-asociacion-id="{{ conjunto.asociacion_id }}">{{ conjunto.nombre }}</option>{% endfor %}</select></div>
                        {% endif %}
                        <div class="col-md-4 form-group"><label>Bloque <span class="required-mark">*</span></label><select name="bloque_id" id="crearDanzarinBloque" class="form-control" required><option value="">Selecciona</option>{% for bloque in bloques %}<option value="{{ bloque.id }}" data-conjunto-id="{{ bloque.conjunto_id }}">{{ bloque.nombre }}</option>{% endfor %}</select></div>
                    </div>
                    <div class="form-row">
                        <div class="col-md-6 form-group">
                            <label>Prefijo del código <span class="required-mark">*</span></label>
                            <input type="text" name="codigo_prefijo" class="form-control" maxlength="2" minlength="2" pattern="[A-Za-z]{2}" placeholder="Ej.: CB" required>
                        </div>
                        <div class="col-md-6 form-group">
                            <label>Número del código <span class="required-mark">*</span></label>
                            <input type="text" name="codigo_numero" class="form-control numeric-only" maxlength="6" minlength="6" pattern="[0-9]{6}" inputmode="numeric" placeholder="Ej.: 000001" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="col-md-6 form-group">
                            <label>Nombres <span class="required-mark">*</span></label>
                            <input type="text" name="nombre" class="form-control" placeholder="Ej.: Juan Carlos" required>
                        </div>
                        <div class="col-md-6 form-group">
                            <label>Apellido paterno <span class="required-mark">*</span></label>
                            <input type="text" name="apellido_paterno" class="form-control" placeholder="Ej.: Pérez" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="col-md-6 form-group">
                            <label>Apellido materno</label>
                            <input type="text" name="apellido_materno" class="form-control" placeholder="Ej.: García">
                        </div>
                        <div class="col-md-6 form-group"><label>Género</label><select name="sexo" class="form-control"><option value="">No especificado</option><option value="m">Varón</option><option value="f">Mujer</option><option value="otro">Otro</option></select></div>
                    </div>
                    <div class="form-row">
                        <div class="col-md-6 form-group">
                            <label>Correo <span class="required-mark">*</span></label>
                            <input type="email" name="email" class="form-control" placeholder="Ej.: correo@ejemplo.com" required>
                        </div>
                        <div class="col-md-6 form-group">
                            <label>Teléfono</label>
                            <input type="text" name="telefono" class="form-control" placeholder="Ej.: 71100714">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="col-md-6 form-group">
                            <label>Fecha de nacimiento</label>
                            <input type="date" name="fecha_nacimiento" class="form-control" placeholder="dd/mm/aaaa">
                        </div>
                        <div class="col-md-6 form-group">
                            <label>Ciudad</label>
                            <input type="text" name="ciudad" class="form-control" placeholder="Ej.: Oruro">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="col-md-6 form-group">
                            <label>Dirección</label>
                            <input type="text" name="direccion" class="form-control" placeholder="Ej.: Av. principal #123">
                        </div>
                        <div class="col-md-6 form-group">
                            <label>Carnet / CI <span class="required-mark">*</span></label>
                                     <input type="text" name="carnet_ci" class="form-control numeric-only" maxlength="15" pattern="[0-9]+" inputmode="numeric" placeholder="Ej.: 1234567" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="col-md-6 form-group">
                            <label>Complemento CI (opcional)</label>
                            <input type="text" name="carnet_complemento" class="form-control" placeholder="Opcional">
                        </div>
                        <div class="col-md-6 form-group">
                            <label>Ingreso al grupo</label>
                            <input type="date" name="fecha_ingreso_grupo" class="form-control" placeholder="dd/mm/aaaa">
                            <small class="form-text text-muted">Puede ser una fecha aproximada para danzarines antiguos.</small>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Observación / Nota</label>
                        <textarea name="observacion" class="form-control" rows="2" placeholder="Escribe una observación si corresponde"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Observación de antigüedad</label>
                        <input type="text" name="antiguedad_observacion" class="form-control" maxlength="200" placeholder="Ej.: Pertenece al grupo desde aproximadamente 2012">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
