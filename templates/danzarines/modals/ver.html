<div class="modal fade modal-ver-danzarin" id="modalVerDanzarin" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-danzarin-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Detalle del Danzarín</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Cerrar">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-md-6">
                        <p><strong>Código de danzarín:</strong> <span id="verCodigoDanzarin" style="font-weight:bold; color:#007bff;"></span></p>
                        <p><strong>Nombre:</strong> <span id="verNombre"></span></p>
                        <p><strong>Apellido paterno:</strong> <span id="verApellidoPaterno"></span></p>
                        <p><strong>Apellido materno:</strong> <span id="verApellidoMaterno"></span></p>
                        <p><strong>Correo:</strong> <span id="verEmail"></span></p>
                        <p><strong>Teléfono:</strong> <span id="verTelefono"></span></p>
                        <p><strong>CI:</strong> <span id="verCarnetCi"></span> <small id="verCarnetComplemento"></small></p>
                    </div>
                    <div class="col-md-6">
                        <p><strong>Ciudad:</strong> <span id="verCiudad"></span></p>
                        <p><strong>Dirección:</strong> <span id="verDireccion"></span></p>
                        <p><strong>Estado:</strong> <span id="verEstado"></span></p>
                        <p><strong>Fecha de nacimiento:</strong> <span id="verFechaNacimiento"></span></p>
                        <p><strong>Souvenir:</strong> <span id="verSouvenir"></span></p>
                        <p><strong>Ingreso:</strong> <span id="verFechaIngreso"></span></p>
                        <p><strong>Asociación:</strong> <span id="verAsociacion"></span></p>
                        <p><strong>Conjunto:</strong> <span id="verConjunto"></span></p>
                        <p><strong>Bloque:</strong> <span id="verBloque"></span></p>
                        <p><strong>Creado por:</strong> <span id="verCreadoPor"></span></p>
                        <p><strong>Rol del creador:</strong> <span id="verRolCreador"></span></p>
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col-12">
                        <p><strong>Observación:</strong></p>
                        <p id="verObservacion"></p>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light" data-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>
