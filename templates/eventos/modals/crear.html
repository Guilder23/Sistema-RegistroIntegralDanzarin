<div class="modal fade modal-crear-gestion" id="modalCrearEvento" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-danzarin-dialog" role="document">
        <div class="modal-content">
            <form method="post" action="{% url 'eventos:crear_evento' %}">
                {% csrf_token %}
                <div class="modal-header">
                    <h5 class="modal-title">Crear evento</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Cerrar">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>Nombre</label>
                        <input type="text" name="nombre" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Descripción</label>
                        <textarea name="descripcion" class="form-control" rows="3"></textarea>
                    </div>
                    <div class="form-row">
                        <div class="col-md-4 form-group">
                            <label for="crearEventoTipoAmbito">Crear para</label>
                            <select id="crearEventoTipoAmbito" name="tipo_ambito" class="form-control" required>
                                <option value="asociacion">Asociación</option>
                                <option value="conjunto">Conjunto</option>
                            </select>
                        </div>
                        <div class="col-md-4 form-group">
                            <label for="crearEventoAsociacion">Asociación</label>
                            <select id="crearEventoAsociacion" name="asociacion_id" class="form-control" required>
                                <option value="">Selecciona una asociación</option>
                                {% for asociacion in asociaciones %}
                                <option value="{{ asociacion.pk }}">{{ asociacion.nombre }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4 form-group" id="crearEventoConjuntoGrupo" style="display: none;">
                            <label for="crearEventoConjunto">Conjunto</label>
                            <select id="crearEventoConjunto" name="conjunto_id" class="form-control">
                                <option value="">Selecciona un conjunto</option>
                                {% for conjunto in conjuntos %}
                                <option value="{{ conjunto.pk }}" data-asociacion-id="{{ conjunto.asociacion_id }}">{{ conjunto.nombre }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="col-md-6 form-group">
                            <label>Fecha del evento</label>
                            <input type="date" name="fecha_evento" class="form-control" required>
                        </div>
                        <div class="col-md-6 form-group">
                            <label>Lugar</label>
                            <input type="text" name="lugar" class="form-control">
                        </div>
                    </div>
                    <div class="form-group form-check">
                        <input type="checkbox" name="activo" class="form-check-input" id="crearEventoActivo" checked>
                        <label class="form-check-label" for="crearEventoActivo">Activo</label>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
