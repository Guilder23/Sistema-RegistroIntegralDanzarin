<div class="modal fade modal-crear-gestion" id="modalCrearEvento" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-danzarin-dialog" role="document">
        <div class="modal-content">
            <form method="post" action="{% url 'eventos:crear_evento' %}">
                {% csrf_token %}
                <div class="modal-header">
                    <h5 class="modal-title">Crear evento</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Cerrar">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>Nombre</label>
                        <input type="text" name="nombre" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Descripción</label>
                        <textarea name="descripcion" class="form-control" rows="3"></textarea>
                    </div>
                    <div class="form-row">
                        <div class="col-md-4 form-group">
                            <label for="crearEventoTipoAmbito">Crear para</label>
                            <select id="crearEventoTipoAmbito" name="tipo_ambito" class="form-control" required {% if role == 'administrador_conjunto' %}disabled{% endif %}>
                                {% if role == 'superadministrador' or role == 'administrador_asociacion' %}<option value="asociacion" {% if role == 'administrador_asociacion' %}selected{% endif %}>Asociación</option>{% endif %}
                                <option value="conjunto" {% if role == 'administrador_conjunto' %}selected{% endif %}>Conjunto</option>
                            </select>
                            {% if role == 'administrador_conjunto' %}<input type="hidden" name="tipo_ambito" value="conjunto">{% endif %}
                        </div>
                        <div class="col-md-4 form-group">
                            <label for="crearEventoAsociacion">Asociación</label>
                            <select id="crearEventoAsociacion" name="asociacion_id" class="form-control" required {% if role != 'superadministrador' %}disabled{% endif %}>
                                {% if role == 'superadministrador' %}<option value="">Selecciona una asociación</option>{% endif %}
                                {% for asociacion in asociaciones %}
                                <option value="{{ asociacion.pk }}" {% if role != 'superadministrador' %}selected{% endif %}>{{ asociacion.nombre }}</option>
                                {% endfor %}
                            </select>
                            {% if role != 'superadministrador' %}<input type="hidden" name="asociacion_id" value="{{ request.user.userprofile.asociacion_id }}">{% endif %}
                        </div>
                        <div class="col-md-4 form-group" id="crearEventoConjuntoGrupo" style="display: {% if role == 'administrador_conjunto' %}block{% elif role == 'administrador_asociacion' %}none{% else %}none{% endif %};">
                            <label for="crearEventoConjunto">Conjunto</label>
                            <select id="crearEventoConjunto" name="conjunto_id" class="form-control" {% if role == 'administrador_conjunto' %}disabled{% endif %}>
                                <option value="">Selecciona un conjunto</option>
                                {% for conjunto in conjuntos %}
                                <option value="{{ conjunto.pk }}" data-asociacion-id="{{ conjunto.asociacion_id }}" {% if role == 'administrador_conjunto' and conjunto.pk == request.user.userprofile.conjunto_id %}selected{% endif %}>{{ conjunto.nombre }}</option>
                                {% endfor %}
                            </select>
                            {% if role == 'administrador_conjunto' %}<input type="hidden" name="conjunto_id" value="{{ request.user.userprofile.conjunto_id }}">{% endif %}
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="col-md-3 form-group">
                            <label>Fecha de inicio</label>
                            <input type="date" name="fecha_inicio" class="form-control" required>
                        </div>
                        <div class="col-md-3 form-group">
                            <label>Fecha de fin</label>
                            <input type="date" name="fecha_fin" class="form-control" required>
                        </div>
                        <div class="col-md-6 form-group">
                            <label>Lugar</label>
                            <input type="text" name="lugar" class="form-control">
                        </div>
                    </div>
                    <div class="form-group form-check">
                        <input type="checkbox" name="activo" class="form-check-input" id="crearEventoActivo" checked>
                        <label class="form-check-label" for="crearEventoActivo">Activo</label>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
