<div class="modal fade modal-crear-gestion" id="modalCrearSouvenir" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-socio-dialog" role="document">
        <div class="modal-content">
            <form method="post" action="{% url 'souvenirs:crear_souvenir' %}" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="modal-header">
                    <h5 class="modal-title">Crear souvenir</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Cerrar">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label>Nombre</label>
                        <input type="text" name="nombre" class="form-control" required>
                    </div>
                    {% if role == 'superadministrador' %}
                    <div class="form-row">
                        <div class="col-md-4 form-group"><label>Crear para</label><select id="crearSouvenirTipo" class="form-control"><option value="asociacion">Asociación</option><option value="conjunto">Conjunto</option></select></div>
                        <div class="col-md-4 form-group"><label>Asociación</label><select name="asociacion_id" id="crearSouvenirAsociacion" class="form-control" required><option value="">Selecciona</option>{% for asociacion in asociaciones %}<option value="{{ asociacion.id }}">{{ asociacion.nombre }}</option>{% endfor %}</select></div>
                        <div class="col-md-4 form-group" id="crearSouvenirConjuntoGrupo" style="display: none;"><label>Conjunto</label><select name="conjunto_id" id="crearSouvenirConjunto" class="form-control" disabled><option value="">Selecciona un conjunto</option>{% for conjunto in conjuntos %}<option value="{{ conjunto.id }}" data-asociacion-id="{{ conjunto.asociacion_id }}">{{ conjunto.nombre }}</option>{% endfor %}</select></div>
                    </div>
                    {% elif role == 'administrador_asociacion' %}
                    <div class="form-row">
                        <div class="col-md-6 form-group"><label>Asociación</label><select class="form-control" disabled><option>{{ request.user.userprofile.asociacion.nombre }}</option></select><input type="hidden" name="asociacion_id" value="{{ request.user.userprofile.asociacion_id }}"></div>
                        <div class="col-md-6 form-group"><label>Conjunto</label><select name="conjunto_id" id="crearSouvenirConjunto" class="form-control" required><option value="">Selecciona</option>{% for conjunto in conjuntos %}<option value="{{ conjunto.id }}">{{ conjunto.nombre }}</option>{% endfor %}</select></div>
                    </div>
                    {% else %}
                    <div class="form-row">
                        <div class="col-md-6 form-group"><label>Asociación</label><select class="form-control" disabled><option>{{ request.user.userprofile.asociacion.nombre }}</option></select><input type="hidden" name="asociacion_id" value="{{ request.user.userprofile.asociacion_id }}"></div>
                        <div class="col-md-6 form-group"><label>Conjunto</label><select class="form-control" disabled><option>{{ request.user.userprofile.conjunto.nombre }}</option></select><input type="hidden" name="conjunto_id" value="{{ request.user.userprofile.conjunto_id }}"></div>
                    </div>
                    {% endif %}
                    <div class="form-group">
                        <label>Evento</label>
                        <select name="evento_id" id="crearSouvenirEvento" class="form-control">
                            <option value="">Sin evento</option>
                            {% for evento in eventos %}
                            <option value="{{ evento.id }}" data-asociacion-id="{{ evento.asociacion_id }}" data-conjunto-id="{{ evento.conjunto_id|default:'' }}">{{ evento.nombre }} - {{ evento.fecha_evento|date:'d/m/Y' }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Descripción</label>
                        <textarea name="descripcion" class="form-control" rows="3"></textarea>
                    </div>
                    <div class="form-row">
                        <div class="col-md-6 form-group">
                            <label>Stock</label>
                            <input type="number" name="stock" class="form-control" min="0" value="0">
                        </div>
                        <div class="col-md-6 form-group">
                            <label>Imagen</label>
                            <input type="file" name="imagen" class="form-control-file" accept="image/*">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
