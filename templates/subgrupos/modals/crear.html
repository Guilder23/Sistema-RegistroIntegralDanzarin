<div class="modal fade" id="modalCrearSubgrupo"><div class="modal-dialog"><div class="modal-content"><form method="post" action="{% url 'subgrupos:crear_subgrupo' %}">{% csrf_token %}<div class="modal-header"><h5>Nuevo subgrupo</h5></div><div class="modal-body"><label>Grupo</label><select class="form-control" name="grupo_id">{% for grupo in grupos %}<option value="{{ grupo.id }}">{{ grupo.nombre }}</option>{% endfor %}</select><label class="mt-3">Nombre</label><input class="form-control" name="nombre" required></div><div class="modal-footer"><button class="btn btn-primary">Guardar</button></div></form></div></div></div>
